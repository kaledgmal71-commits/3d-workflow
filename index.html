<head>

<style>
:root{--bg:#0a1428;--pn:#0f1c38;--tx:#e6eefc;--mu:#8fa3c7;--bd:#22345c;--ac:#5ab0ff}
@media(prefers-color-scheme:light){:root{--bg:#eef3fb;--pn:#fff;--tx:#10203f;--mu:#566a90;--bd:#cbd6ea;--ac:#1d6fd6}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.75 "Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--bd)}
h1{font-size:16px;margin:0;flex:1;min-width:150px}
button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:3px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
#cat{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:6px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
#cat span{color:var(--mu)}
main{flex:1;display:flex;min-height:0}
#w{flex:1;min-width:0;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#bk{position:absolute;top:10px;inset-inline-start:10px;z-index:2}
aside{width:340px;overflow:auto;background:var(--pn);border-inline-start:1px solid var(--bd);padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media(max-width:760px){main{flex-direction:column}aside{width:auto;max-height:42%;border-inline-start:0;border-top:1px solid var(--bd)}}
h2{font-size:17px;margin:4px 0}h2 small{color:var(--mu);font-weight:400;font-size:12px}
h3{font-size:13px;margin:14px 0 4px;color:var(--mu)}
p{margin:4px 0}.mu{color:var(--mu)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:12px;color:var(--mu)}
.kp b{display:block;font-size:20px;color:var(--tx)}
.br{display:flex;align-items:center;gap:8px;font-size:12px}.br span{width:44px}
.br i{display:block;height:8px;border-radius:4px}.br em{font-style:normal;color:var(--mu)}
.st{display:flex;gap:8px;padding:5px 9px;border:1px solid var(--bd);border-radius:8px;margin:3px 0}
.st b{color:var(--ac)}
.ch{display:inline-block;margin:2px;padding:0 9px;border:1px solid var(--bd);border-radius:99px;cursor:pointer;font-size:13px}
.bg{display:inline-block;padding:0 9px;border-radius:99px;color:#06101f;font-size:12px;font-weight:600}
.seg{display:flex;gap:4px}#sub{position:absolute;bottom:14px;left:0;right:0;text-align:center;pointer-events:none;z-index:2;font-size:clamp(14px,2.1vw,23px);font-weight:700;line-height:1.5;white-space:nowrap;color:var(--tx);-webkit-text-stroke:4px var(--bg);paint-order:stroke fill;text-shadow:0 1px 6px var(--bg)}#tc{position:absolute;top:10px;inset-inline-end:10px;display:flex;gap:6px;z-index:2}</style>
</head>

function docText(){const mp=mainPath(),L=['# وثيقة العمل','','الملحقات المفعّلة: '+([...act].map(i=>PK.find(p=>p.id==i).n).join('، ')||'لا شيء (الأساس فقط)'),'','> أسماء الغرف من معايير وأطر معروفة (لكل غرفة مصدرها ودرجتها)؛ أما ترتيبها وتفرعها فتركيب لتوضيح التسلسل المعتاد.',''];
 const sec=(n,i)=>{const pre=E.filter(e=>e[1]==n.id&&e[3]!='s'),su=E.filter(e=>e[0]==n.id&&e[3]!='s');
  L.push('### '+(i?i+'. ':'')+n.ar+' · '+n.en,'','- النوع: '+TN[n.t]+' ('+TNE[n.t]+')','- الوظيفة: '+n.d,'- تستقبل من: '+(pre.map(e=>N[e[0]].ar).join('، ')||'—'),'- تُرسل إلى: '+(su.map(e=>(e[2]?e[2]+' ← ':'')+N[e[1]].ar+(e[3]=='b'?' ↺':'')).join('، ')||'—'),'- يدخلها: '+(n.sub?n.sub.ia:'—'),'- يخرج منها: '+(n.sub?n.sub.oa:'—'),'- السير الداخلي (المكوّنات بالترتيب):',...(n.sub?n.sub.order.map((k,i)=>'  '+(i+1)+'. '+n.sub.nd[k].ar+' — '+n.sub.nd[k].en):n.s.map((x,k)=>'  '+(k+1)+'. '+x)),'- ما يُفسدها: '+n.f,'- اختبارها: '+TT[n.t]);
  if(n.std)L.push('- المطابقة الدولية: '+LV[n.std[0]][0]+' — '+n.std[1]+' ('+n.std[2]+')');L.push('')};
 L.push('## المسار الرئيسي','');mp.forEach((id,i)=>sec(N[id],i+1));
 const rest=Object.values(N).filter(n=>!mp.includes(n.id));if(rest.length){L.push('## غرف أخرى: فروع وإرجاع وملحقات','');rest.forEach(n=>sec(n,0))}
 if(globalThis.PLAN&&PLAN.risks&&PLAN.risks.length){L.push('## المخاطر المقترحة للمشروع','');PLAN.risks.forEach(k=>L.push('- '+k.ar+(k.mitigation?' — المعالجة: '+k.mitigation:'')))}
 return L.join('\n')}
function exportDoc(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([docText()],{type:'text/markdown'}));a.download='work-document.md';a.click()}
let sbc=null;
async function sbClient(){if(sbc)return sbc;if(!globalThis.SB)throw new Error('لم يُضبط ملف config.js');const m=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/+esm');sbc=m.createClient(SB.url,SB.key);sbc.auth.onAuthStateChange(()=>{if(SD.querySelector('#ai-msg'))aiPanel()});return sbc}
async function aiPanel(plan){selId=null;let mail='';try{const sb=await sbClient();const r=await sb.auth.getSession();mail=r.data.session?r.data.session.user.email:''}catch(e){}
 let hook='';try{hook=localStorage.getItem('zh')||''}catch(e){}
 SD.innerHTML=`<p><button id="bk3">لوحة القياس</button></p><h2>المساعد الذكي</h2><p class="mu">صِف مشروعك فيُخصَّص له خط العمل: يختار الملحقات المناسبة ويضيف غرفًا مخصصة بسيرها الداخلي. كل ما يقترحه خارج السجل المعتمد يُوسَم «اقتراح غير موثّق مرجعيًا».</p>`
 +(mail?`<p>الحساب: <b dir="ltr">${cl(mail,80)}</b> <button id="ai-out">خروج</button></p>`:`<h3>الدخول</h3><p><input id="ai-mail" type="email" dir="ltr" placeholder="بريدك" style="width:100%"></p><p><button id="ai-in">أرسل رابط الدخول</button></p>`)
 +`<h3>وصف المشروع</h3><p><textarea id="ai-idea" rows="5" style="width:100%" placeholder="ماذا تبني؟ لمن؟ ما القيود (وقت، فريق، ميزانية)؟"></textarea></p><p><input id="ai-dom" placeholder="المجال (اختياري)" style="width:100%"></p><p><button id="ai-gen">ولّد سير عملي</button></p><div id="ai-msg" class="mu"></div>`
 +(plan?`<h3>الخطة المطبَّقة: ${cl(plan.title,80)}</h3><p>${cl(plan.summary,700)}</p>`+(plan.risks&&plan.risks.length?'<h3>المخاطر المقترحة</h3>'+plan.risks.map(k=>`<div class="st" style="display:block">${cl(k.ar,200)}<br><span class="mu">${cl(k.mitigation,300)}</span></div>`).join(''):''):'')
 +`<h3>استيراد خطة JSON</h3><p><textarea id="ai-json" rows="4" dir="ltr" style="width:100%" placeholder='{"title":"...","packs":["web"],"custom_rooms":[],"risks":[]}'></textarea></p><p><button id="ai-imp">طبّق الخطة</button></p>`
 +`<h3>إرسال وثيقة العمل إلى Zapier</h3><p><input id="ai-hook" dir="ltr" value="${cl(hook,300)}" placeholder="رابط Catch Hook" style="width:100%"></p><p><button id="ai-zap">أرسل</button></p>`}
function applyPlan(plan){const n=planCore(plan);renderCat();fitOrb();return n}
function importPlan(){const m=$('#ai-msg');try{const p=JSON.parse($('#ai-json').value);const n=applyPlan(p);aiPanel(globalThis.PLAN);$('#ai-msg').textContent='طُبّقت الخطة: '+n+' غرفة مخصصة.'}catch(e){m.textContent='تعذّر التطبيق: '+e.message}}
async function genPlan(){const m=$('#ai-msg');try{const sb=await sbClient(),r=await sb.auth.getSession();if(!r.data.session){m.textContent='سجّل الدخول أولًا.';return}
 m.textContent='جارٍ التصميم… قد يستغرق دقيقة.';const{data,error}=await sb.functions.invoke('plan-project',{body:{idea:$('#ai-idea').value,domain:$('#ai-dom').value}});
 if(error){let msg=error.message;try{const j=await error.context.json();msg=j.message||j.error||msg}catch(_){}m.textContent='تعذّر: '+msg;return}
 applyPlan(data.plan);aiPanel(globalThis.PLAN);$('#ai-msg').textContent='طُبّقت الخطة وحُفظت في حسابك.'}catch(e){m.textContent='تعذّر: '+e.message}}
async function signIn(){const m=$('#ai-msg');try{const sb=await sbClient(),em=$('#ai-mail').value.trim();if(!em){return}const{error}=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.href.split('#')[0]}});if(m)m.textContent=error?'تعذّر: '+error.message:'أُرسل رابط الدخول إلى بريدك.'}catch(e){if(m)m.textContent='تعذّر: '+e.message}}
async function signOut(){try{const sb=await sbClient();await sb.auth.signOut();aiPanel()}catch(e){}}
function sendZap(){const m=$('#ai-msg'),u=($('#ai-hook').value||'').trim();if(!/^https:\/\/hooks\.zapier\.com\//.test(u)){if(m)m.textContent='الصق رابط Catch Hook من Zapier (يبدأ بـ https://hooks.zapier.com/).';return}
 try{localStorage.setItem('zh',u)}catch(e){}fetch(u,{method:'POST',mode:'no-cors',body:new URLSearchParams({title:(globalThis.PLAN&&PLAN.title)||'وثيقة العمل',packs:[...act].join(','),document:docText()})}).then(()=>{if(m)m.textContent='أُرسلت. (تحقق من سجل الـ Zap؛ وانتبه إلى حصة مهام حسابك.)'}).catch(e=>{if(m)m.textContent='تعذّر الإرسال: '+e.message})}
function exportLines(){const T=buildTour(),seen=new Set(),L=[];T.S.forEach(s=>{if(s.say){const id=fnv(s.say);if(!seen.has(id)){seen.add(id);L.push({id,text:s.say,prep:prep(s.say,'tts')})}}});
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(L,null,1)],{type:'application/json'}));a.download='lines.json';a.click()}
SD.onclick=e=>{const c=e.target.closest('.ch');if(c){select(c.dataset.id);return}const id=e.target.id;
 if(id=='eb'&&selId){setMode('walk')}else if(id=='sb'&&selId){foc=selId;$('#bk').hidden=false}else if(id=='exl')exportLines();else if(id=='stb')stdTable();else if(id=='bk2'||id=='bk3')stats();else if(id=='ai-gen')genPlan();else if(id=='ai-imp')importPlan();else if(id=='ai-in')signIn();else if(id=='ai-out')signOut();else if(id=='ai-zap')sendZap();else if(id=='exd')exportDoc();else if(id=='vt')testVoice();else if(id=='vr'){pickVoice();voiceDiag()}else if(id=='vp'){const u=Object.values(AIDX)[0];if(u)playFile(u,()=>{},()=>{$('#vmsg').textContent='تعذّر تشغيل ملف الحزمة'})}};
SD.onchange=e=>{if(e.target.id=='vsel'){const v=speechSynthesis.getVoices().find(x=>x.name==e.target.value);if(v){voice=v;try{localStorage.setItem('vn',v.name)}catch(_){}}}};
$('#vd').onclick=voiceDiag;$('#hp').onclick=helpPanel;$('#ai').onclick=()=>aiPanel();
$('#bk').onclick=()=>{foc=null;$('#bk').hidden=true};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$('#tr0').onclick=()=>jump(-1);$('#tr1').onclick=togglePause;$('#tr2').onclick=()=>jump(1);
$('#tr3').onclick=e=>{if(!voice&&!Object.keys(AIDX).length){voiceDiag();return}soundOn=!soundOn;e.target.textContent=soundOn?'الصوت: يعمل':'الصوت: صامت';if(!soundOn)stopSay()};
const renderCat=()=>{$('#cat').innerHTML='<span>نوع مشروعك:</span>'+PK.map(p=>`<button data-p="${p.id}"${act.has(p.id)?' class="on"':''}>${p.n}</button>`).join('')};renderCat();
$('#cat').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.p;act.has(id)?act.delete(id):act.add(id);b.classList.toggle('on');
 foc=null;selId=null;$('#bk').hidden=true;build();if(mode=='tour'||mode=='walk')setMode('orbit');else fitOrb();stats()};
$('#pl').onclick=e=>{play=!play;e.target.classList.toggle('on',play);e.target.textContent=play?'المحاكاة تعمل':'المحاكاة متوقفة'};
const pt=new Map();let mv=0,pd=0,btn=0;
const pdist=()=>{const a=[...pt.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1};
cv.onpointerdown=e=>{if(foc)return;cv.setPointerCapture(e.pointerId);pt.set(e.pointerId,[e.clientX,e.clientY]);mv=0;btn=e.button;if(pt.size==2)pd=pdist()};
cv.onpointermove=e=>{if(!pt.has(e.pointerId)||foc)return;const o=pt.get(e.pointerId),dx=e.clientX-o[0],dy=e.clientY-o[1];pt.set(e.pointerId,[e.clientX,e.clientY]);mv+=Math.abs(dx)+Math.abs(dy);
 if(mode=='tour')return;if(mode=='walk'){ply.yaw+=dx*.005;ply.pit=clamp(ply.pit+dy*.004,-1.2,1.2);return}
 if(pt.size==2){const d=pdist();orb.dist=clamp(orb.dist*pd/d,150,6000);pd=d;return}
 if(mode=='top'||e.shiftKey||btn==2){const u=orb.dist/H*1.1,s=Math.sin(orb.yaw),c=Math.cos(orb.yaw);orb.tx+=-c*dx*u+s*dy*u;orb.tz+=-s*dx*u-c*dy*u}
 else{orb.yaw+=dx*.006;orb.pit=clamp(orb.pit+dy*.005,.15,1.55)}};
cv.onpointerup=e=>{if(!foc&&pt.size==1&&mv<6&&(mode=='orbit'||mode=='top')){const r=cv.getBoundingClientRect(),id=pickAt(e.clientX-r.left,e.clientY-r.top);if(id)select(id)}pt.delete(e.pointerId)};
cv.onpointercancel=e=>pt.delete(e.pointerId);cv.oncontextmenu=e=>e.preventDefault();
cv.onwheel=e=>{e.preventDefault();if(mode=='orbit'||mode=='top')orb.dist=clamp(orb.dist*Math.exp(e.deltaY*.001),150,6000)};
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code=='Escape'){if(foc){foc=null;$('#bk').hidden=true}else if(mode!='orbit')setMode('orbit')}
 if(mode=='tour'){if(e.code=='Space'){e.preventDefault();togglePause()}if(e.code=='KeyN')jump(1);if(e.code=='KeyP')jump(-1)}
 if(mode=='walk'&&e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{delete keys[e.code]});
let dp=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#ins').hidden=false});
$('#ins').onclick=()=>{if(dp)dp.prompt()};
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
fetch('audio/index.json').then(r=>r.ok?r.json():{}).then(j=>{AIDX=j}).catch(()=>{});
matchMedia('(prefers-color-scheme:light)').addEventListener('change',theme);
new ResizeObserver(()=>{resize();if(mode=='orbit'||mode=='top')fitOrb()}).observe($('#w'));
resize();theme();build();fitOrb();Object.assign(cam,desire());stats();requestAnimationFrame(frame);
</script>
